[package]
name = "rust-guardrail"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP szerver és routing
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }

# HTTP kliens az LLM és külső API hívásokhoz (blocking feature hozzáadva)
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Adatszerializáció
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Pattern Matching PII és Injection szűréshez
regex = "1.10"

# Környezeti változók (.env)
dotenvy = "0.15"

# Base64 kódolás a VirusTotal URL azonosítókhoz
base64 = "0.22"