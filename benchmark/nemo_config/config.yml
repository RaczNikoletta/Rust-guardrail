# NeMo Guardrails config for the benchmark comparison (input rail only).
# The engine name depends on the installed langchain provider; langchain-google-genai
# reads the key from GOOGLE_API_KEY (use the same value as GEMINI_API_KEY).
models:
  - type: main
    engine: google_genai
    model: gemini-3.5-flash-lite
    api_key_env_var: OPENAI_API_KEY
    parameters:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/

rails:
  input:
    flows:
      - self check input
